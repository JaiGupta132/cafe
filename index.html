<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sullivan Coffee House — 249 Sullivan St, Greenwich Village</title>
<meta name="description" content="Sullivan Coffee House is a café on Sullivan Street in Greenwich Village, New York. Espresso, cold brew, tea, and fresh pastries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1F3B2F;
    --green-mid:#2E5642;
    --cream:#F7F1E3;
    --paper:#FCFAF3;
    --brass:#B4863C;
    --brass-light:#D6AE6C;
    --ink:#241A12;
    --brick:#8C4A34;
    --line: rgba(36,26,18,0.14);
    --max: 1100px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
    color:var(--green-deep);
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  img,svg{display:block; max-width:100%;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}

  /* awning stripe motif */
  .stripes{
    height:14px;
    background:repeating-linear-gradient(
      90deg,
      var(--green-deep) 0 34px,
      var(--cream) 34px 68px
    );
  }

  /* nav */
  header.site{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    max-width:var(--max); margin:0 auto;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--green-deep);
    text-decoration:none;
    display:flex; align-items:center; gap:10px;
  }
  .brand .mark{width:26px; height:26px; flex:0 0 auto;}
  nav.links{display:flex; gap:28px;}
  nav.links a{
    text-decoration:none;
    font-size:0.95rem;
    color:var(--ink);
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:border-color .15s ease;
  }
  nav.links a:hover{border-color:var(--brass);}
  .nav-toggle{display:none;}

  /* hero */
  .hero{padding:0 0 64px;}
  .hero-photo{
    width:100%;
    line-height:0;
    border-bottom:1px solid var(--line);
  }
  .hero-photo img{
    width:100%;
    height:auto;
    display:block;
    object-fit:cover;
  }
  .hero-copy{
    max-width:var(--max);
    margin:0 auto;
    padding:40px 28px 0;
  }
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .hero-copy .lede{
    max-width:52ch;
    font-size:1.08rem;
    color:#3A2C20;
  }
  .hero-copy .cta-row{
    display:flex; gap:16px; margin-top:26px; flex-wrap:wrap;
  }
  .btn{
    display:inline-block;
    padding:12px 22px;
    border-radius:2px;
    text-decoration:none;
    font-size:0.95rem;
    font-weight:500;
    border:1px solid var(--green-deep);
  }
  .btn.primary{
    background:var(--green-deep);
    color:var(--paper);
  }
  .btn.primary:hover{background:var(--green-mid);}
  .btn.ghost{
    background:transparent;
    color:var(--green-deep);
  }
  .btn.ghost:hover{background:rgba(31,59,47,0.06);}

  /* about */
  .about{
    padding:72px 0;
    background:var(--cream);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .about .grid{
    display:grid;
    grid-template-columns:0.85fr 1.15fr;
    gap:56px;
    align-items:start;
  }
  .about h2{font-size:1.9rem; margin-bottom:20px;}
  .about p{max-width:58ch; color:#3A2C20;}
  .facts{
    list-style:none; margin:28px 0 0; padding:0;
    display:grid; gap:14px;
  }
  .facts li{
    display:flex; gap:12px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    font-size:0.95rem;
  }
  .facts li:last-child{border-bottom:none;}
  .facts .label{
    color:var(--brass);
    font-family:'Fraunces', serif;
    font-weight:600;
    min-width:118px;
  }

  /* menu */
  .menu{padding:80px 0;}
  .menu > .wrap > h2{font-size:1.9rem; text-align:left;}
  .menu .intro{max-width:56ch; color:#3A2C20; margin-top:14px;}
  .menu-columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:56px;
    margin-top:44px;
  }
  .menu-columns h3{
    font-size:1.2rem;
    padding-bottom:10px;
    border-bottom:2px solid var(--green-deep);
  }
  .menu-list{list-style:none; margin:22px 0 0; padding:0;}
  .menu-list li{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:11px 0;
    border-bottom:1px dotted var(--line);
  }
  .menu-list li:last-child{border-bottom:none;}
  .item-name{font-weight:600; white-space:nowrap;}
  .item-desc{
    color:#5B4A3B;
    font-size:0.92rem;
    text-align:right;
    margin-left:auto;
  }

  /* visit */
  .visit{
    background:var(--green-deep);
    color:var(--paper);
    padding:76px 0;
  }
  .visit .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:56px;
  }
  .visit h2{color:var(--paper); font-size:1.9rem;}
  .visit .addr{
    margin-top:20px;
    font-size:1.05rem;
  }
  .visit .addr strong{
    display:block;
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    font-weight:600;
    margin-bottom:6px;
  }
  .badge{
    display:inline-block;
    margin-top:22px;
    padding:7px 14px;
    border:1px solid var(--brass-light);
    color:var(--brass-light);
    border-radius:2px;
    font-size:0.85rem;
  }
  .info-list{list-style:none; margin:0; padding:0;}
  .info-list li{
    padding:13px 0;
    border-bottom:1px solid rgba(247,241,227,0.18);
    display:flex; justify-content:space-between; gap:20px;
    font-size:0.95rem;
  }
  .info-list li:last-child{border-bottom:none;}
  .info-list .k{color:var(--brass-light);}
  .note{
    margin-top:24px;
    font-size:0.88rem;
    color:rgba(247,241,227,0.7);
    max-width:42ch;
  }

  /* footer */
  footer{
    padding:40px 0 34px;
    text-align:center;
    font-size:0.88rem;
    color:#6b5c4d;
  }
  footer .brand-line{
    font-family:'Fraunces', serif;
    color:var(--green-deep);
    font-size:1.05rem;
    margin-bottom:8px;
  }
  footer .footer-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  footer .footer-line svg{flex:0 0 auto;}
  footer .divider{color:var(--line);}

  @media (max-width:820px){
    nav.links{display:none;}
    .about .grid, .visit .grid{grid-template-columns:1fr;}
    .menu-columns{grid-template-columns:1fr; gap:36px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }
</style>
</head>
